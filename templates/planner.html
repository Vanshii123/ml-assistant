<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Planner — Study Assistant</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap');

        :root {
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --glass-bg: rgba(255, 255, 255, 0.55);
            --glass-border: rgba(255, 255, 255, 0.6);
            --glass-bg-strong: rgba(255, 255, 255, 0.72);
            --blue: #0071e3;
            --blue-bright: #2997ff;
            --shadow: 0 8px 32px rgba(31, 38, 68, 0.08);
            --shadow-hover: 0 16px 44px rgba(31, 38, 68, 0.16);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            color: var(--text);
            min-height: 100vh;
            background: #f5f5f7;
            overflow-x: hidden;
            position: relative;
        }

        .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: 0.55; z-index: 0; pointer-events: none; }
        .blob-1 { width: 520px; height: 520px; top: -160px; left: -120px; background: radial-gradient(circle, #7dd3fc, #60a5fa); animation: float1 22s ease-in-out infinite; }
        .blob-2 { width: 460px; height: 460px; top: 20%; right: -160px; background: radial-gradient(circle, #c4b5fd, #a78bfa); animation: float2 26s ease-in-out infinite; }
        .blob-3 { width: 420px; height: 420px; bottom: -140px; left: 10%; background: radial-gradient(circle, #fbcfe8, #f9a8d4); animation: float3 24s ease-in-out infinite; }
        @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px,60px); } }
        @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-50px,40px); } }
        @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(30px,-40px); } }
        @media (prefers-reduced-motion: reduce) { .blob { animation: none; } }

        .page { position: relative; z-index: 1; max-width: 780px; margin: 0 auto; padding: 64px 24px 80px; }

        /* ---------- HERO ---------- */
        .hero-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            box-shadow: var(--shadow);
            padding: 48px 40px;
            text-align: center;
        }

        .hero-icon {
            width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--blue-bright), var(--blue));
            box-shadow: 0 8px 20px rgba(0, 113, 227, 0.35);
            color: #fff; font-size: 26px;
        }

        .hero-card h1 {
            font-family: 'Sora', -apple-system, sans-serif;
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1.14;
            background: linear-gradient(120deg, #1d1d1f 35%, #3d6fb4 65%, #7c5cd4 100%);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }

        .hero-card p { margin-top: 12px; color: var(--text-secondary); font-size: 16px; }

        .mode-toggle { display: flex; justify-content: center; gap: 8px; margin: 28px 0 0; }
        .mode-btn {
            font-family: 'Sora', -apple-system, sans-serif;
            text-decoration: none; font-size: 13.5px; font-weight: 600;
            color: var(--text-secondary); padding: 8px 18px; border-radius: 20px;
            transition: all 0.25s ease; display: inline-flex; align-items: center; gap: 6px;
        }
        .mode-btn:hover { background: rgba(0, 0, 0, 0.05); color: var(--text); }
        .mode-btn.active { background: var(--text); color: #fff; }

        /* ---------- FORM ---------- */
        .form-card {
            margin-top: 28px;
            background: var(--glass-bg-strong);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            box-shadow: var(--shadow);
            padding: 28px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .form-group label i { color: var(--blue); font-size: 13px; }

        .form-group select, .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            background: rgba(255,255,255,0.7);
            color: var(--text);
            font-size: 14.5px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }
        .form-group select:focus, .form-group input:focus {
            border-color: rgba(0, 113, 227, 0.4);
            box-shadow: 0 0 0 3px rgba(0, 113, 227, 0.1);
        }

        #generateBtn {
            width: 100%;
            margin-top: 22px;
            padding: 15px;
            background: linear-gradient(135deg, var(--blue-bright), var(--blue));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Sora', -apple-system, sans-serif;
            letter-spacing: -0.01em;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(0, 113, 227, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        #generateBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 22px rgba(0, 113, 227, 0.4); }
        #generateBtn:disabled { opacity: 0.75; cursor: not-allowed; transform: none; }

        /* ---------- LOADING ---------- */
        .loading { display: none; margin: 40px 0; text-align: center; color: var(--text-secondary); }
        .loading.active { display: block; }
        .loading h3 { font-family: 'Sora', -apple-system, sans-serif; font-size: 16px; color: var(--text); margin-top: 16px; font-weight: 600; }
        .loading p { font-size: 13.5px; margin-top: 4px; }

        /* ---------- RESULTS ---------- */
        .results { display: none; margin-top: 32px; }
        .results.active { display: block; }

        .plan-summary {
            background: linear-gradient(135deg, rgba(0,113,227,0.9), rgba(124,92,212,0.9));
            border-radius: 22px;
            padding: 28px;
            box-shadow: var(--shadow-hover);
            color: white;
        }
        .plan-summary h2 { font-family: 'Sora', -apple-system, sans-serif; font-size: 20px; font-weight: 700; }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin-top: 20px; }
        .stat-box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }
        .stat-value { font-family: 'Sora', -apple-system, sans-serif; font-size: 28px; font-weight: 700; }
        .stat-label { font-size: 12px; opacity: 0.85; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.04em; }

        .week-section-title {
            font-family: 'Sora', -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.03em;
            margin: 28px 0 14px;
        }

        .week-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 22px;
            margin: 14px 0;
            transition: box-shadow 0.3s ease, transform 0.3s ease;
        }
        .week-card:hover { box-shadow: var(--shadow-hover); transform: translateY(-2px); }

        .week-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
        .week-title { font-family: 'Sora', -apple-system, sans-serif; font-size: 17px; font-weight: 700; color: var(--text); }
        .week-hours {
            background: rgba(0, 113, 227, 0.1);
            color: var(--blue);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12.5px;
            font-weight: 700;
        }

        .week-card p { font-size: 14px; color: var(--text-secondary); margin-bottom: 12px; }
        .week-card p strong { color: var(--text); }

        .skills-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
        .skill-tag {
            background: rgba(0,0,0,0.04);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 14px;
            font-size: 12.5px;
            font-weight: 500;
            border: 1px solid rgba(0,0,0,0.06);
        }

        .reasoning-box {
            background: rgba(0, 113, 227, 0.05);
            border-left: 3px solid var(--blue);
            padding: 12px 16px;
            border-radius: 10px;
            margin-top: 14px;
            font-size: 13.5px;
            color: var(--text-secondary);
        }
        .reasoning-box strong { color: var(--text); }

        .resources-list { margin-top: 14px; }
        .resources-list > strong { font-size: 12.5px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.03em; }
        .resource-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            background: rgba(0,0,0,0.025);
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 10px;
            font-size: 13.5px;
        }
        .resource-type {
            background: var(--blue);
            color: white;
            font-size: 10px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 10px;
            margin-right: 10px;
            letter-spacing: 0.02em;
        }
        .resource-item a { color: var(--blue); text-decoration: none; font-weight: 600; }

        @media (max-width: 600px) {
            .hero-card h1 { font-size: 28px; }
            .hero-card { padding: 36px 24px; }
            .form-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="page">
        <div class="hero-card">
            <div class="hero-icon"><i class="bi bi-stars"></i></div>
            <h1>Your personal study coach.</h1>
            <p>Get a week-by-week learning plan tailored to your goal and schedule.</p>

            <div class="mode-toggle">
                <a href="/" class="mode-btn"><i class="bi bi-search"></i> Quick Search</a>
                <a href="/planner" class="mode-btn active"><i class="bi bi-stars"></i> Smart Planner</a>
            </div>
        </div>

        <div class="form-card">
            <div class="form-grid">
                <div class="form-group">
                    <label><i class="bi bi-flag"></i> Learning Goal</label>
                    <select id="goal">
                        <option value="ml_internship">Machine Learning Career</option>
                        <option value="data_science">Data Science Role</option>
                        <option value="web_development">Web Development</option>
                        <option value="mobile_development">Mobile App Development</option>
                        <option value="cloud_engineering">Cloud Engineering</option>
                        <option value="cyber_security">Cyber Security</option>
                        <option value="game_development">Game Development</option>
                        <option value="devops_engineer">DevOps Engineering</option>
                        <option value="blockchain_development">Blockchain Development</option>
                        <option value="ml_engineer">ML Engineering</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="bi bi-bar-chart"></i> Current Level</label>
                    <select id="level">
                        <option value="beginner">Beginner</option>
                        <option value="intermediate">Intermediate</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>

                <div class="form-group">
                    <label><i class="bi bi-calendar3"></i> Timeline (weeks)</label>
                    <input type="number" id="weeks" value="12" min="4" max="52">
                </div>

                <div class="form-group">
                    <label><i class="bi bi-clock"></i> Hours per Day</label>
                    <input type="number" id="hours" value="2" min="0.5" max="8" step="0.5">
                </div>
            </div>

            <button onclick="generatePlan()" id="generateBtn">
                <i class="bi bi-magic"></i> Generate My Learning Plan
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner-border" style="color: var(--blue); width: 40px; height: 40px;" role="status"></div>
            <h3>Building your personalized plan...</h3>
            <p>This takes about 10–15 seconds</p>
        </div>

        <div class="results" id="results">
            <div class="plan-summary">
                <h2>Your Personalized Learning Plan</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="totalWeeks">-</div>
                        <div class="stat-label">Weeks</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="totalHours">-</div>
                        <div class="stat-label">Study Hours</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" id="successProb">-</div>
                        <div class="stat-label">Success Rate</div>
                    </div>
                </div>
            </div>

            <div id="weeklyPlan"></div>
        </div>
    </div>

    <script>
        async function generatePlan() {
            const goal = document.getElementById('goal').value;
            const level = document.getElementById('level').value;
            const weeks = parseInt(document.getElementById('weeks').value);
            const hours = parseFloat(document.getElementById('hours').value);

            const btn = document.getElementById('generateBtn');
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Generating...';

            try {
                const response = await fetch('/api/create-plan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        goal: goal,
                        level: level,
                        weeks: weeks,
                        hours_per_day: hours,
                        days_per_week: 5
                    })
                });

                const data = await response.json();

                if (data.success) {
                    displayPlan(data.plan);
                } else {
                    alert('Error: ' + (data.error || 'Failed to generate plan'));
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Failed to connect. Please try again.');
            } finally {
                document.getElementById('loading').classList.remove('active');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-magic"></i> Generate My Learning Plan';
            }
        }

        function displayPlan(plan) {
            document.getElementById('totalWeeks').textContent = plan.total_weeks;
            document.getElementById('totalHours').textContent = Math.round(plan.total_hours) + 'h';
            document.getElementById('successProb').textContent = Math.round(plan.success_probability * 100) + '%';

            const weeklyPlanDiv = document.getElementById('weeklyPlan');
            weeklyPlanDiv.innerHTML = '<div class="week-section-title">Week-by-Week Breakdown</div>';

            plan.modules.forEach(module => {
                const weekCard = document.createElement('div');
                weekCard.className = 'week-card';

                let resourcesHtml = '';
                if (module.resources && module.resources.length > 0) {
                    resourcesHtml = '<div class="resources-list"><strong>Learning Resources</strong>';
                    module.resources.forEach(resource => {
                        const typeLabel = resource.type.toUpperCase();
                        resourcesHtml += `
                            <div class="resource-item">
                                <div>
                                    <span class="resource-type">${typeLabel}</span>
                                    ${resource.title}
                                </div>
                                ${resource.url ? `<a href="${resource.url}" target="_blank">View</a>` : ''}
                            </div>
                        `;
                    });
                    resourcesHtml += '</div>';
                }

                weekCard.innerHTML = `
                    <div class="week-header">
                        <div class="week-title">Week ${module.week_number}: ${module.title}</div>
                        <div class="week-hours">${module.estimated_hours.toFixed(1)}h</div>
                    </div>
                    <p><strong>Goal:</strong> ${module.objective}</p>
                    <div class="skills-tags">
                        ${module.skills_covered.map(skill => `<span class="skill-tag">${skill}</span>`).join('')}
                    </div>
                    ${resourcesHtml}
                    <div class="reasoning-box">
                        <strong>Why this order?</strong> ${module.reasoning}
                    </div>
                `;

                weeklyPlanDiv.appendChild(weekCard);
            });

            document.getElementById('results').classList.add('active');
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
